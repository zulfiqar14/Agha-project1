<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b1b">
  <title>Hello, Agha — Make Something Wonderful</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root { color-scheme: dark; --ink: #f4f2ff; --muted: #aaa9c2; --line: rgba(255,255,255,.13); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; color: var(--ink); font-family: Manrope, ui-sans-serif, system-ui, sans-serif; background: #090b1b; }
    body::before, body::after { content: ""; position: fixed; z-index: -1; width: 58vw; height: 58vw; border-radius: 50%; filter: blur(110px); opacity: .38; pointer-events: none; }
    body::before { top: -30vw; left: -18vw; background: #5d45e8; }
    body::after { right: -22vw; bottom: -38vw; background: #00cdb5; opacity: .17; }
    .grain { position: fixed; inset: 0; z-index: -1; opacity: .18; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.23'/%3E%3C/svg%3E"); }
    .shell { width: min(1120px, calc(100% - 64px)); min-height: 100vh; margin: auto; display: flex; flex-direction: column; }
    header { height: 94px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .mark { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid rgba(255,255,255,.25); border-radius: 11px; background: linear-gradient(145deg, rgba(255,255,255,.15), rgba(255,255,255,.02)); color: #c5baff; font-size: 18px; }
    .availability { display: flex; align-items: center; gap: 9px; color: #c2c1d4; font: 11px 'DM Mono', monospace; letter-spacing: .04em; }
    .topnav { display: flex; align-items: center; gap: 24px; margin-left: auto; margin-right: 30px; }
    .topnav a { color: #aaa9c2; text-decoration: none; font-size: 12px; font-weight: 600; transition: color .2s; }
    .topnav a:hover, .topnav a[aria-current="page"] { color: #f4f2ff; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #59e6be; box-shadow: 0 0 12px #59e6be; }
    main { position: relative; flex: 1; display: grid; place-items: center; padding: 80px 0; }
    .orbit { position: absolute; left: 50%; top: 50%; width: min(700px, 72vw); aspect-ratio: 1; border: 1px solid rgba(255,255,255,.055); border-radius: 50%; transform: translate(-50%,-50%); pointer-events: none; }
    .orbit::before, .orbit::after { content: ""; position: absolute; inset: 10%; border: 1px solid rgba(255,255,255,.045); border-radius: inherit; }
    .orbit::after { inset: 22%; }
    .hero { position: relative; width: 100%; max-width: 790px; text-align: center; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; padding: 9px 13px; border: 1px solid var(--line); border-radius: 99px; color: #d2caff; background: rgba(255,255,255,.045); font: 10px 'DM Mono', monospace; letter-spacing: .13em; text-transform: uppercase; }
    .eyebrow span { color: #8e7aff; font-size: 14px; }
    h1 { margin: 30px 0 0; font-size: clamp(64px, 10.7vw, 132px); line-height: .91; letter-spacing: -.085em; font-weight: 800; }
    h1 .hello { display: block; color: #f8f7ff; }
    h1 .world { display: block; padding-right: .09em; background: linear-gradient(100deg, #a794ff 10%, #e4b4ff 49%, #79e9d5 92%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .subtitle { max-width: 440px; margin: 28px auto 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .actions { display: flex; justify-content: center; gap: 12px; margin-top: 34px; }
    button { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 19px; border: 1px solid var(--line); border-radius: 9px; color: #e8e6f4; background: rgba(255,255,255,.04); font: 600 12px Manrope, sans-serif; cursor: pointer; transition: transform .2s, background .2s, border-color .2s; }
    button:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.32); background: rgba(255,255,255,.09); }
    button.primary { color: #111126; border-color: transparent; background: linear-gradient(105deg, #b7a7ff, #d9bbff 52%, #a0efe1); box-shadow: 0 8px 30px rgba(166,139,255,.22); }
    button.primary:hover { background: linear-gradient(105deg, #c7bbff, #e4caff 52%, #b7f7eb); }
    button:focus-visible { outline: 2px solid #b7a7ff; outline-offset: 4px; }
    .arrow { font-size: 16px; line-height: 0; }
    .note { min-height: 20px; margin-top: 17px; color: #a5f2df; font: 11px 'DM Mono', monospace; opacity: 0; transition: opacity .2s; }
    .note.visible { opacity: 1; }
    footer { height: 76px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); color: #85849e; font: 10px 'DM Mono', monospace; letter-spacing: .04em; }
    .footer-right { display: flex; align-items: center; gap: 8px; }
    .spark { color: #a899ff; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 760px) { .availability { display: none; } .topnav { margin-right: 0; gap: 16px; } }
    @media (max-width: 600px) { .shell { width: calc(100% - 40px); } .topnav { gap: 12px; } .topnav a { font-size: 11px; } header { height: 76px; } .availability { font-size: 9px; } main { padding: 56px 0; } .orbit { width: 105vw; } h1 { margin-top: 25px; font-size: clamp(58px, 17vw, 96px); } .subtitle { font-size: 14px; padding: 0 8px; } .actions { flex-direction: column; align-items: stretch; padding: 0 24px; } footer { font-size: 9px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="shell">
    <header>
      <a class="brand" href="#" aria-label="Studio home"><span class="mark" aria-hidden="true">✳</span><span>Little Big Studio</span></a>
      <nav class="topnav" aria-label="Main navigation"><a href="index.html" aria-current="page">Home</a><a href="about.html">About</a><a href="gallery.html">Gallery</a><a href="contact.html">Contact</a></nav>
      <div class="availability"><span class="dot" aria-hidden="true"></span> GOOD THINGS ARE HAPPENING</div>
    </header>
    <main>
      <div class="orbit" aria-hidden="true"></div>
      <section class="hero" aria-labelledby="headline">
        <div class="eyebrow"><span aria-hidden="true">✦</span> A tiny page with big energy</div>
        <h1 id="headline"><span class="hello">Hello,</span><span class="world">World.</span></h1>
        <p class="subtitle">Every great idea starts somewhere. Here’s to the first line, the fresh start, and everything wonderful that comes next.</p>
        <div class="actions">
          <button class="primary" id="helloButton">Say hello <span class="arrow" aria-hidden="true">↗</span></button>
          <button id="copyButton">Copy the greeting <span aria-hidden="true">⧉</span></button>
        </div>
        <div class="note" id="note" role="status" aria-live="polite"></div>
      </section>
    </main>
    <footer><span>MADE FOR THE MOMENT YOU BEGIN</span><span class="footer-right"><span class="spark">✦</span> KEEP MAKING MAGIC</span></footer>
  </div>
  <script>
    const note = document.getElementById('note');
    document.getElementById('helloButton').addEventListener('click', () => {
      note.textContent = 'And hello right back to you ✨';
      note.classList.add('visible');
    });
    document.getElementById('copyButton').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText('Hello, World!');
        note.textContent = 'Copied: Hello, World!';
      } catch {
        note.textContent = 'Hello, World!';
      }
      note.classList.add('visible');
    });
  </script>
</body>
</html>
